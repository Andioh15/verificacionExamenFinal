# ==========================================
# ⚙️ CONFIGURACIÓN DE LA APLICACIÓN
# ==========================================
spring.application.name=verificacion
# Cambiamos el puerto a 8081 para evitar conflicto con Jenkins (8080)
server.port=8081

# ==========================================
# 🗄️ CONFIGURACIÓN DE BASE DE DATOS (PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://35.223.245.145:5432/validacionverificacion
spring.datasource.username=postgres
spring.datasource.password=BarcelonaPasion_123
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 📝 CONFIGURACIÓN DE JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# 🐞 LOGGING Y DEPURACIÓN
# ==========================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==========================================
# 🔍 SWAGGER / OPENAPI (Opcional pero recomendado para CRUD)
# ==========================================
# Esto te ayudará mucho cuando hagas las pruebas con Burp Suite
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html